{% extends "base.html" %}
{% block title %}Read Easy{% endblock %}
{% block content %}

<div class="container py-4">

    <!-- Header -->
    <div class="d-flex align-items-center mb-4">
        <a href="#"
            onclick="window.location.href='/dashboard?session_id=' + new URLSearchParams(window.location.search).get('session_id')"
            class="btn btn-outline-secondary btn-sm me-3">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        <div>
            <h4 class="fw-bold mb-0">
                <i class="fas fa-book me-2 text-primary"></i>Read Easy
            </h4>
            <small class="text-muted">Simplified language for easier reading</small>
        </div>
    </div>

    <!-- Generate button -->
    <div id="generateSection" class="text-center py-4">
        <p class="text-muted mb-3">Click below to generate this mode for your uploaded content.</p>
        <button id="generateBtn" class="btn btn-primary px-5 py-2 fw-semibold" onclick="generateFeature()">
            <i class="fas fa-book me-2"></i>Generate Read Easy
        </button>
    </div>

    <!-- Loading state -->
    <div id="loadingState" class="text-center py-5 d-none">
        <div class="spinner-border text-primary"></div>
        <p class="mt-3 text-muted">Generating your content...</p>
    </div>

    <!-- Error state -->
    <div id="errorState" class="alert alert-danger d-none"></div>

    <!-- Content panel -->
    <div id="featureContent" class="d-none"></div>

</div>

{% endblock %}
{% block extra_js %}
<script>
    const SESSION_ID = new URLSearchParams(window.location.search).get("session_id");
    const TOKEN = localStorage.getItem("sb_token");
    const TAB_NAME = "read_easy";

    window.addEventListener("DOMContentLoaded", async () => {
        if (!SESSION_ID) {
            document.getElementById("generateSection").classList.add("d-none");
            showError("No session found. Please go back to the dashboard and upload content first.");
            return;
        }
        try {
            const res = await fetch(`/api/session/${SESSION_ID}`, {
                headers: { "Authorization": `Bearer ${TOKEN}` }
            });
            const data = await res.json();
            if (data.generated_tabs && data.generated_tabs.includes(TAB_NAME)) {
                await generateFeature();
            }
        } catch (e) { }
    });

    async function generateFeature() {
        document.getElementById("generateSection").classList.add("d-none");
        document.getElementById("loadingState").classList.remove("d-none");
        document.getElementById("errorState").classList.add("d-none");

        try {
            const res = await fetch(`/api/generate/${TAB_NAME}`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ session_id: SESSION_ID })
            });
            let result;
            try {
                result = await res.json();
            } catch (e) {
                throw new Error("Invalid response from server. Please go back and re-upload your content.");
            }
            if (!res.ok) throw new Error(result.error || "Generation failed");

            document.getElementById("loadingState").classList.add("d-none");
            document.getElementById("featureContent").classList.remove("d-none");
            renderContent(result.data);

        } catch (err) {
            document.getElementById("loadingState").classList.add("d-none");
            showError(err.message);
        }
    }

    function showError(msg) {
        const el = document.getElementById("errorState");
        el.textContent = msg;
        el.classList.remove("d-none");
    }

    function renderContent(data) {
        document.getElementById("featureContent").innerHTML = `
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <p class="lead fw-semibold">${data.intro}</p>
          <hr>
          ${data.paragraphs.map(p =>
            `<p class="fs-5 lh-lg mb-3">${p}</p>`
        ).join("")}
          <p class="text-muted fst-italic border-top pt-3">${data.summary_line}</p>

          <!-- Audio section -->
          <div class="border-top pt-4 mt-2">
            <div class="d-flex align-items-center gap-3">
              <button class="btn btn-outline-primary"
                id="listenBtn" onclick="loadAudio()">
                <i class="bi bi-headphones me-2"></i>Listen to Read Easy
              </button>
              <span class="text-muted small" id="audioStatus"></span>
            </div>
            <div id="audioPlayer" class="mt-3 d-none">
              <audio controls class="w-100" id="audioEl">
                <source id="audioSrc" type="audio/mpeg">
                Your browser does not support audio playback.
              </audio>
            </div>
          </div>

        </div>
      </div>`;
    }

    async function loadAudio() {
        const btn = document.getElementById("listenBtn");
        const status = document.getElementById("audioStatus");

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Generating audio...`;
        status.textContent = "This may take a few seconds...";

        try {
            const res = await fetch("/api/audio/read-easy", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ session_id: SESSION_ID })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Audio generation failed");

            document.getElementById("audioSrc").src = data.audio_url;
            document.getElementById("audioEl").load();
            document.getElementById("audioPlayer").classList.remove("d-none");

            btn.innerHTML = `<i class="bi bi-headphones me-2"></i>Listen to Read Easy`;
            btn.disabled = false;
            status.textContent = data.cached ? "Loaded from cache" : "Audio ready";

        } catch (err) {
            btn.innerHTML = `<i class="bi bi-headphones me-2"></i>Listen to Read Easy`;
            btn.disabled = false;
            status.textContent = `Error: ${err.message}`;
            status.classList.add("text-danger");
        }
    }
</script>
{% endblock %}
