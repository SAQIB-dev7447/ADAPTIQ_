<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdaptIQ - Learn in the format your brain prefers</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg border-bottom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
                <div class="logo-icon me-2">
                    <i class="fas fa-brain text-primary"></i>
                </div>
                <span class="fw-bold fs-4">AdaptIQ</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link px-3"
                            href="{{ url_for('index', _anchor='how-it-works') }}">How it works</a></li>
                    <li class="nav-item"><a class="nav-link px-3"
                            href="{{ url_for('index', _anchor='features') }}">Features</a></li>
                    <li class="nav-item"><a class="nav-link px-3"
                            href="{{ url_for('index', _anchor='pricing') }}">Pricing</a></li>
                    <li class="nav-item ms-lg-3"><a class="btn btn-primary px-4 rounded-pill"
                            href="{{ url_for('dashboard') }}">Get Started</a></li>
                    <li class="nav-item ms-lg-2"><a class="btn btn-light px-4 rounded-pill" href="javascript:void(0)"
                            onclick="alert('Login functionality coming soon!')">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="py-5 bg-light mt-auto">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <div class="footer-logo d-flex align-items-center mb-3 mb-md-0">
                        <i class="fas fa-brain text-primary me-2"></i>
                        <span class="fw-bold fs-5">AdaptIQ</span>
                    </div>
                </div>
                <div class="col-md-4 text-center">
                    <div class="footer-links">
                        <a href="#" class="text-muted mx-2 text-decoration-none small">Privacy Policy</a>
                        <a href="#" class="text-muted mx-2 text-decoration-none small">Terms of Service</a>
                        <a href="#" class="text-muted mx-2 text-decoration-none small">Contact Support</a>
                    </div>
                </div>
                <div class="col-md-4 text-md-end text-center mt-3 mt-md-0">
                    <span class="text-muted small">&copy; 2026 AdaptIQ Inc. All rights reserved.</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
